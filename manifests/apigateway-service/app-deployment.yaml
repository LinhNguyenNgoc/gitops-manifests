apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-service
  namespace: microservices-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway-service
  template:
    metadata:
      labels:
        app: apigateway-service
    spec:
      containers:
      - name: apigateway-service
        image: lnnguyen2795/apigateway-service:latest
        ports:
        - containerPort: 9000
        env:
        - name: ORDER_SERVICE_URI
          value: "http://order-service:8082"
        - name: PAYMENT_SERVICE_URI
          value: "http://payment-service:8084"
        - name: INVENTORY_SERVICE_URI
          value: "http://inventory-service:8083"