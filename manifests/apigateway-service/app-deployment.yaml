apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-service
  namespace: microservices-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway-service
  template:
    metadata:
      labels:
        app: apigateway-service
    spec:
      containers:
      - name: apigateway-service
        image: lnnguyen2795/apigateway-service:5
        ports:
        - containerPort: 8080