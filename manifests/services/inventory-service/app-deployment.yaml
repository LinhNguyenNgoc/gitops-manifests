apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: microservices-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8083"
    spec:
      containers:
      - name: inventory-service
        image: lnnguyen2795/inventory-service:latest
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://inventory-db:5432/inventory_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-service.microservices-ns.svc.cluster.local:9092"
        
        # --- ĐÃ CẬP NHẬT VÀ BỔ SUNG CHO TEMPO ---
        - name: OTLP_TRACING_ENDPOINT
          value: "http://tempo:4318/v1/traces"
        - name: MANAGEMENT_OTLP_TRACING_EXPORT_OTLP_ENDPOINT
          value: "http://tempo:4318/v1/traces"