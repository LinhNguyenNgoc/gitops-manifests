apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservices-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      containers:
      - name: order-service
        image: lnnguyen2795/order-service:latest
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://order-db:5432/order_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        # Bổ sung biến môi trường cho K8s:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-service.microservices-ns.svc.cluster.local:9092"
        - name: OTLP_TRACING_ENDPOINT
          value: "http://tempo.microservices-ns.svc.cluster.local:4317"