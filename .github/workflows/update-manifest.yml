name: Update Image Tag in GitOps

on:
  repository_dispatch:
    types: 
      - update-order-service-image
      - update-payment-service-image
      - update-inventory-service-image
      - update-apigateway-service-image

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v2

      - name: Set up Git config
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Update Image Tag using sed
        run: |
          # Lấy thông tin từ payload gửi sang
          SERVICE_NAME="${{ github.event.client_payload.service_name }}"
          IMAGE_TAG="${{ github.event.client_payload.image_tag }}"
          
          echo "Updating $SERVICE_NAME to tag $IMAGE_TAG"
          
          # Xác định thư mục ứng dụng dựa trên tên service
          # Ví dụ: order-service nằm trong thư mục order-service/app-deployment.yaml
          FILE_PATH="manifests/$SERVICE_NAME/app-deployment.yaml"
          
          if [ -f "$FILE_PATH" ]; then
            # Dùng sed để thay thế image tag cũ bằng tag mới (ví dụ: lnnguyen2795/order-service:12 -> lnnguyen2795/order-service:15)
            sed -i "s|image: lnnguyen2795/$SERVICE_NAME:.*|image: lnnguyen2795/$SERVICE_NAME:$IMAGE_TAG|g" "$FILE_PATH"
          else
            echo "File $FILE_PATH not found!"
            exit 1
          fi

      - name: Commit and Push changes
        run: |
          git status
          git add .
          git commit -m "ci(gitops): update ${{ github.event.client_payload.service_name }} image tag to ${{ github.event.client_payload.image_tag }}"
          git push origin main
