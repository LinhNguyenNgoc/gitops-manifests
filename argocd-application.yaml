apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/LinhNguyenNgoc/gitops-manifests.git'
    targetRevision: main
    path: manifests
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: microservices-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true